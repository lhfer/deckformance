name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    defaults:
      run:
        working-directory: .grok/skills/ppt-cast/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .grok/skills/ppt-cast/scripts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .grok/skills/ppt-cast/scripts/requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk
      - run: npm ci
      - run: python -m pip install --requirement requirements.lock.txt
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .grok/skills/ppt-cast/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: .grok/skills/ppt-cast/scripts/package-lock.json
      - run: npm ci
      - run: npm run coverage
